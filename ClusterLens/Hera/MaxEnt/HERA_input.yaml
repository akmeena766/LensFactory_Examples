observation:
  modeler: LensFactory
  lens: Hera
  z_d: 0.507
  reference: [0.0, 0.0]
  pixel_scale: 0.05
  FOV: [200, 200]


cosmology:
  H0: 72.0
  Omega_m0: 0.24
  Omega_r0: 0.00
  Omega_w0: 0.76


source:
  from_file: true
  source_file: HERA_images.txt


lens_model:
  method: MaxEnt
  multiplane: false
  total_lenses: 1
  alpha: 1.0
  lens1:
    lens: MultiPixelLens
    FOV: [200, 200]
    pixel_scale: 0.8
    default_map:
      type: uniform
      value: 0.5
    

sampling:
  scheme: SourcePlane
  verbose: true
  optimizer:
    enabled: true
    MaxEnt:
      n_runs: 1
      save_runs: true
      save_path: ./HERA_runs/
      refine: true
      refine_rounds: 1
      refine_factor: 2
    LBFGS:
      iterations: 100000
      tolerance: 1e-6